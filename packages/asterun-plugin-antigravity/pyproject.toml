[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asterun-plugin-antigravity"
version = "1.0.0"
description = "可选 Antigravity CLI 1.2.0 原生账户插件"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
asterun-antigravity-plugin = "asterun_plugin_antigravity._vendor.profile:main"
asterun-antigravity-worker = "asterun_plugin_antigravity.worker:main"

[project.entry-points."asterun.providers.v1"]
antigravity = "asterun_plugin_antigravity.worker:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asterun_plugin_antigravity = ["manifest.json", "vendor-source.json"]
