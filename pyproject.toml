[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asterun"
version = "0.1.0a13"
description = "通用 Agent 执行底座，通过 CLI 与 MCP 调用多个 Agent。"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Asterun contributors" }]
license = { text = "Apache-2.0" }
dependencies = [
    "jsonschema[format-nongpl]==4.26.0",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "setuptools>=69",
    "wheel",
]

[project.scripts]
asterun = "asterun.cli:main"
asterun-grok = "asterun.grok_profile:main"
asterun-antigravity = "asterun.antigravity_profile:main"

[project.urls]
Repository = "https://github.com/zonzideka/asterun"

[tool.setuptools]
license-files = ["LICENSE"]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["asterun.tests*"]

[tool.setuptools.package-data]
asterun = ["schemas/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["references*", "*.sqlite", "credentials*", ".env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error"]
norecursedirs = ["references", ".git", ".venv", "dist", "build"]
