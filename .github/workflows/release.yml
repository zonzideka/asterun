name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 核对标签与核心版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "([^"]+)"$', text)
          if not match:
              raise SystemExit("pyproject.toml 缺少 version")
          print(match.group(1))
          PY
          )"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与核心版本 v${version} 不一致" >&2
            exit 1
          fi
          echo "CORE_VERSION=${version}" >> "$GITHUB_ENV"
      - name: 安装构建工具
        run: python -m pip install --disable-pip-version-check 'setuptools>=69' wheel
      - name: 构建、检查并冒烟
        run: python scripts/build-release-assets.py --output "${RUNNER_TEMP}/asterun-dist"
      - name: 构建来源证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/asterun-dist/*.whl
            ${{ runner.temp }}/asterun-dist/*.tar.gz
            ${{ runner.temp }}/asterun-dist/*.zip
            ${{ runner.temp }}/asterun-dist/SHA256SUMS
      - name: 创建预发布
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          commit="$(git rev-parse HEAD)"
          cat > "$notes" <<EOF
          本预发布由标签 ${GITHUB_REF_NAME} 的提交 ${commit} 构建。

          资产为核心 wheel、源码包、标准 skill zip、各外部插件 wheel 与源码包，以及 SHA256SUMS。SHA256SUMS 每行是小写 SHA-256、两个空格和文件名，不含清单自身。来源证明由 actions/attest-build-provenance 写入本仓库，可用 gh attestation verify 核对。安装前先核对 SHA256SUMS。本工作流只创建 GitHub 预发布，不需要额外密钥。

          说明：https://github.com/zonzideka/asterun/blob/${commit}/docs/release-v0.1.md
          EOF
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/asterun-dist/"* \
            --prerelease \
            --title "Asterun ${CORE_VERSION}" \
            --notes-file "$notes"
