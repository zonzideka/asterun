name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HOME: /tmp/asterun-ci-home
      ASTERUN_HOME: /tmp/asterun-ci-home/asterun
      ASTERUN_VERIFY_TMP: /tmp/asterun-release-verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 核对标签提交在 main 上
        run: |
          set -euo pipefail
          git fetch origin main
          python scripts/check-release-tag.py --tag "${GITHUB_REF_NAME}"
      - name: 离线校验
        run: |
          mkdir -p "$HOME" "$ASTERUN_HOME"
          chmod +x scripts/verify-offline.sh
          scripts/verify-offline.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 再次核对标签提交在 main 上
        run: |
          set -euo pipefail
          git fetch origin main
          python scripts/check-release-tag.py --tag "${GITHUB_REF_NAME}"
      - name: 安装构建工具
        run: python -m pip install --disable-pip-version-check 'setuptools>=69' wheel
      - name: 构建、检查并冒烟
        run: python scripts/build-release-assets.py --output "${RUNNER_TEMP}/asterun-dist"
      - name: 判断已有发行
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release-assets.py --assets "${RUNNER_TEMP}/asterun-dist" --tag "${GITHUB_REF_NAME}" --phase gate
      - name: 构建来源证明
        if: steps.gate.outputs.mode == 'publish'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/asterun-dist/*.whl
            ${{ runner.temp }}/asterun-dist/*.tar.gz
            ${{ runner.temp }}/asterun-dist/*.zip
            ${{ runner.temp }}/asterun-dist/SHA256SUMS
      - name: 上传草稿并发布
        if: steps.gate.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release-assets.py --assets "${RUNNER_TEMP}/asterun-dist" --tag "${GITHUB_REF_NAME}" --phase apply
